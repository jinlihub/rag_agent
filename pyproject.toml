[project]
name = "rag-agent"
version = "0.1.0"
description = "招投标智能问答机器人（LLM + Agent + RAG）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langfuse>=5.1.0",
    "mcp>=2.3.0",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.9.0",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "zai-sdk>=0.2.3",
]

[project.scripts]
rag-agent = "rag_agent:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# 只覆盖纯逻辑（分类/融合/工具函数），不连数据库、不调 LLM，本地随时可跑：
#   uv run pytest
